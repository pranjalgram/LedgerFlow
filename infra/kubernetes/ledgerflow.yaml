# Source: ledgerflow/templates/edge.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledgerflow-backend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ledgerflow-backend}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}

---
# Source: ledgerflow/templates/edge.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledgerflow
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ledgerflow.example.com"]
      secretName: ledgerflow-tls
  rules:
    - host: "ledgerflow.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledgerflow-frontend
                port: {number: 8080}
