# Source: ledgerflow/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerflow-backend
spec:
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: ledgerflow-backend}
  template:
    metadata:
      labels: {app: ledgerflow-backend}
      annotations:
        checksum/config: ebe3ead84fcc84ccb17ae3a645035127df87951cf1598609131f142b5e5f9eef
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: "ghcr.io/your-organization/ledgerflow-backend:0.1.0"
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: ledgerflow-config}
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: ledgerflow-runtime, key: redis-password}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ledgerflow-runtime, key: db-password}}
            - name: METRICS_PASSWORD
              valueFrom: {secretKeyRef: {name: ledgerflow-runtime, key: metrics-password}}
            - name: WEBHOOK_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: ledgerflow-runtime, key: webhook-key}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: keys, mountPath: /run/keys, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: keys
          secret:
            secretName: ledgerflow-runtime
            defaultMode: 0440
            items:
              - {key: jwt-private.pem, path: jwt-private.pem}
              - {key: jwt-public.pem, path: jwt-public.pem}

