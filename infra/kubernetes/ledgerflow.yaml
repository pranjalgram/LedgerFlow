apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: ledgerflow-frontend}
  template:
    metadata:
      labels: {app: ledgerflow-frontend}
      annotations:
        checksum/config: ebe3ead84fcc84ccb17ae3a645035127df87951cf1598609131f142b5e5f9eef
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: "ghcr.io/your-organization/ledgerflow-frontend:0.1.0"
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: config
          configMap: {name: ledgerflow-nginx}

