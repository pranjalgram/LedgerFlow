# Source: ledgerflow/templates/migration.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ledgerflow-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "ghcr.io/your-organization/ledgerflow-backend:0.1.0"
          command: [java, '-Dloader.main=com.ledgerflow.MigrationApplication', '-cp', /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
          env:
            - {name: DB_URL, value: "jdbc:postgresql://postgres.example.internal:5432/ledgerflow?sslmode=verify-full"}
            - name: DB_MIGRATION_USERNAME
              valueFrom: {secretKeyRef: {name: ledgerflow-migration, key: username}}
            - name: DB_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: ledgerflow-migration, key: password}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

