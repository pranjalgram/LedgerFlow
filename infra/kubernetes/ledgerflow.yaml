# Source: ledgerflow/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerflow-config
data:
  DB_URL: "jdbc:postgresql://postgres.example.internal:5432/ledgerflow?sslmode=verify-full"
  DB_USERNAME: "ledgerflow_app"
  SPRING_FLYWAY_ENABLED: 'false'
  REDIS_HOST: "redis.example.internal"
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
  RATE_LIMIT_ENABLED: 'true'
  JWT_ISSUER: "https://ledgerflow.example.com"
  JWT_PRIVATE_KEY: file:/run/keys/jwt-private.pem
  JWT_PUBLIC_KEY: file:/run/keys/jwt-public.pem
  EVENTS_ENABLED: 'true'
  KAFKA_BOOTSTRAP_SERVERS: "kafka.example.internal:9093"
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SSL"
  WEBHOOK_ALLOWED_ORIGINS: ""
  TRACING_EXPORT_ENABLED: "false"
  TRACING_SAMPLE_RATE: "0.1"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.observability:4318/v1/traces"

---
# Source: ledgerflow/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerflow-nginx
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log off;
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 128k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /healthz { access_log off; return 200 'ok'; }
        location /api/ {
          proxy_pass http://ledgerflow-backend:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_connect_timeout 3s;
          proxy_read_timeout 30s;
        }
        location = /actuator/health/readiness { proxy_pass http://ledgerflow-backend:8080; }
        location /actuator/ { return 404; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri /index.html; expires -1; }
      }
    }

