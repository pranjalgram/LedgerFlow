global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: ledgerflow
    metrics_path: /actuator/prometheus
    basic_auth:
      username: metrics
      password_file: /run/secrets/metrics-password
    static_configs:
      - targets: ['host.docker.internal:8080']
