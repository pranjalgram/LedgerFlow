apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ .Values.backend.image | quote }}
          command: [java, '-Dloader.main=com.ledgerflow.MigrationApplication', '-cp', /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
          env:
            - {name: DB_URL, value: {{ .Values.database.url | quote }}}
            - name: DB_MIGRATION_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.migrationSecret }}, key: username}}
            - name: DB_MIGRATION_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.migrationSecret }}, key: password}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
