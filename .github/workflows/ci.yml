name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check whitespace
        run: python ../scripts/check-format.py
      - name: Compile, architecture tests, PostgreSQL integration tests, package
        run: bash gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example --profile app --profile events --profile observability config --quiet
      - name: Download checksum-verified Helm
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
      - name: Validate chart and rendered example
        run: |
          "$RUNNER_TEMP/linux-amd64/helm" lint infra/helm/ledgerflow
          "$RUNNER_TEMP/linux-amd64/helm" template ledgerflow infra/helm/ledgerflow --set ingress.enabled=true > "$RUNNER_TEMP/rendered.yaml"
          diff -u infra/kubernetes/ledgerflow.yaml "$RUNNER_TEMP/rendered.yaml"
          cmp infra/docker/nginx.conf infra/helm/ledgerflow/files/nginx.conf
  packaged-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral local credentials
        run: |
          java scripts/GenerateLocalEnvironment.java
          java scripts/GenerateDevKeys.java
          java scripts/GenerateWebhookKey.java
          java scripts/GenerateObservabilitySecrets.java
          chmod 644 .local-secrets/*
      - name: Build and start against a clean PostgreSQL volume
        env:
          SPRING_PROFILES_ACTIVE: demo
          EVENTS_ENABLED: 'true'
        run: docker compose --profile app --profile events up --build -d --wait --wait-timeout 180
      - name: Install browser and test packaged dashboard
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8088
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-reports
          path: frontend/test-results
      - name: Stop disposable stack
        if: always()
        run: docker compose --profile app --profile events down -v
