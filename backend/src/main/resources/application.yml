spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 300ms
      connect-timeout: 300ms
  application:
    name: ledgerflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USERNAME:ledgerflow_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 35
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    user: ${DB_MIGRATION_USERNAME:ledgerflow_migrator}
    password: ${DB_MIGRATION_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: ${ledgerflow.events.enabled}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 3000
        request.timeout.ms: 2000
        max.block.ms: 2000
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 20
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          enabled: ${TRACING_EXPORT_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
ledgerflow:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  metrics:
    password: ${METRICS_PASSWORD:}
  webhooks:
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:}
    allowed-origins: ${WEBHOOK_ALLOWED_ORIGINS:}
    allow-local: ${WEBHOOK_ALLOW_LOCAL:false}
  events:
    enabled: ${EVENTS_ENABLED:false}
    topic: ledgerflow.events.v1
  auth:
    issuer: ${JWT_ISSUER:urn:ledgerflow:local}
    private-key: ${JWT_PRIVATE_KEY:file:../.local-secrets/jwt-private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:../.local-secrets/jwt-public.pem}
